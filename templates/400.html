{% extends "base.html" %}

{% block title %}Bad Request — PneuDx{% endblock %}
{% block page_title %}Bad Request{% endblock %}

{% block content %}
<div class="bg-surface rounded-xl border border-border p-10 shadow-sm text-center max-w-lg mx-auto">
    <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-amber-50 text-warning mb-4">
        <i data-lucide="alert-triangle" class="w-7 h-7"></i>
    </div>
    <div class="text-5xl font-bold text-text-primary">400</div>
    <h2 class="text-xl font-semibold mt-2">The request couldn't be processed</h2>
    <p class="text-sm text-text-secondary mt-2">
        Check the form and try again.
    </p>
    <div class="mt-6">
        <a href="{% url 'dashboard' %}"
           class="inline-flex items-center gap-2 bg-primary text-white rounded-lg px-4 py-2 text-sm font-medium hover:bg-primary-hover">
            <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Back to Dashboard
        </a>
    </div>
</div>
{% endblock %}
