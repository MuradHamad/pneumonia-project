<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}PneuDx{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231E40AF' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M22 12h-4l-3 9L9 3l-3 9H2'/%3E%3C/svg%3E" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ["Inter", "system-ui", "sans-serif"] },
                    colors: {
                        primary: "#1E40AF",
                        "primary-hover": "#1E3A8A",
                        "primary-light": "#DBEAFE",
                        surface: "#FFFFFF",
                        background: "#F8FAFC",
                        border: "#E2E8F0",
                        "text-primary": "#0F172A",
                        "text-secondary": "#64748B",
                        "text-muted": "#94A3B8",
                        success: "#16A34A",
                        warning: "#F59E0B",
                        danger: "#DC2626",
                        info: "#0891B2",
                    },
                },
            },
        };
    </script>
</head>
<body class="font-sans bg-background text-text-primary min-h-screen flex items-center justify-center p-6">

<div class="w-full max-w-md">
    <div class="flex items-center justify-center gap-2 mb-6">
        <i data-lucide="activity" class="w-7 h-7 text-primary"></i>
        <span class="text-2xl font-semibold">PneuDx</span>
    </div>

    <div class="bg-surface rounded-xl border border-border p-8 shadow-sm">
        {% if messages %}
            <div class="mb-4 space-y-2" data-toasts>
                {% for message in messages %}
                    <div role="alert"
                         class="toast flex items-start gap-2 px-3 py-2 rounded-lg text-sm border transition-opacity duration-300
                         {% if message.tags == 'error' %}bg-red-50 text-danger border-red-200
                         {% elif message.tags == 'success' %}bg-green-50 text-success border-green-200
                         {% else %}bg-primary-light text-primary border-blue-200{% endif %}">
                        <i data-lucide="{% if message.tags == 'error' %}alert-circle{% elif message.tags == 'success' %}check-circle-2{% else %}info{% endif %}" class="w-4 h-4 mt-0.5 shrink-0"></i>
                        <div class="flex-1">{{ message }}</div>
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}{% endblock %}
    </div>

    <p class="text-center text-sm text-text-secondary mt-6">
        {% block footer %}{% endblock %}
    </p>
</div>

<script>
    lucide.createIcons();
    setTimeout(() => {
        document.querySelectorAll('[data-toasts] .toast').forEach(el => {
            el.style.opacity = '0';
            setTimeout(() => el.remove(), 300);
        });
    }, 5000);
    document.addEventListener('submit', (e) => {
        const form = e.target;
        if (form.method && form.method.toLowerCase() !== 'post') return;
        form.querySelectorAll('button[type="submit"], button:not([type])').forEach(btn => {
            if (btn.disabled) return;
            btn.disabled = true;
            btn.classList.add('opacity-70', 'cursor-not-allowed');
            btn.innerHTML = '<span class="inline-flex items-center gap-2"><svg class="animate-spin w-4 h-4" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="40 60"/></svg>Working…</span>';
        });
    });
</script>
</body>
</html>
