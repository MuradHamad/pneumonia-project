{% extends "cases/_wizard_shell.html" %}

{% block wizard_body %}
<form method="post" enctype="multipart/form-data"
      class="bg-surface rounded-xl border border-border p-6 shadow-sm space-y-6">
    {% csrf_token %}

    <div>
        <h2 class="text-lg font-semibold">Upload Chest X-ray</h2>
        <p class="text-sm text-text-secondary mt-1">JPEG, PNG, or WEBP. Max 10 MB.</p>
    </div>

    <div>
        <label for="{{ form.xray_image.id_for_label }}" class="block text-sm font-medium mb-1">
            {{ form.xray_image.label }}
        </label>
        {{ form.xray_image }}
        {% if form.xray_image.errors %}
            <p class="mt-1 text-xs text-danger">{{ form.xray_image.errors|join:", " }}</p>
        {% endif %}
    </div>

    <div class="flex items-center justify-between pt-4 border-t border-border">
        <a href="{% url 'patients:detail' patient.id %}"
           class="text-sm text-text-secondary hover:text-primary">Cancel</a>
        <button type="submit"
                class="inline-flex items-center gap-2 bg-primary text-white rounded-lg px-4 py-2 text-sm font-medium hover:bg-primary-hover">
            Next <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
    </div>
</form>
{% endblock %}
